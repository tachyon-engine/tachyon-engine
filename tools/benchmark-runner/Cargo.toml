[package]
name = "benchmark-runner"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lib]
path = "src/lib.rs"

[[bin]]
name = "benchmark-runner"
path = "src/main.rs"

[dependencies]
boa_engine = "=0.21.0"
rquickjs = "=0.12.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tachyon-bytecode = { path = "../../crates/tachyon-bytecode" }
tachyon-compiler = { path = "../../crates/tachyon-compiler" }
tachyon-gc = { path = "../../crates/tachyon-gc" }
tachyon-vm = { path = "../../crates/tachyon-vm" }
tempfile = "3"
toml = "0.8"
wait-timeout = "0.2"
