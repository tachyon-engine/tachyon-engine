[package]
name = "xtask"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[[bin]]
name = "xtask"
path = "src/main.rs"

[features]
default = []
opcode-profile = ["benchmark-runner/opcode-profile"]

[dependencies]
benchmark-runner = { path = "../benchmark-runner" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
test262-runner = { path = "../test262-runner" }
toml = "0.8"
